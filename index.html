<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猫ボール</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1410; font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,.6); pointer-events: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; background: rgba(30, 18, 10, .55); padding: 16px; box-sizing: border-box; }
  .screen h1 { font-size: clamp(44px, 12vw, 88px); margin: 0 0 8px; color: #ffcf6e; text-shadow: 0 4px 0 #b5651d, 0 8px 16px rgba(0,0,0,.5); }
  .screen p { margin: 6px 0; font-size: 18px; line-height: 1.6; }
  .screen button { margin-top: 20px; font-size: 22px; font-weight: bold; padding: 12px 40px; border: none; border-radius: 999px; background: #ff9f43; color: #fff; box-shadow: 0 5px 0 #b5651d; cursor: pointer; font-family: inherit; }
  .screen button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b5651d; }
  .hidden { display: none !important; }
  .keys { opacity: .85; font-size: 15px !important; }
  #banner { position: fixed; top: 22%; left: 0; right: 0; text-align: center; color: #fff; font-size: clamp(28px, 7vw, 52px); font-weight: bold; letter-spacing: .1em; text-shadow: 0 3px 0 rgba(90,50,20,.8), 0 6px 18px rgba(0,0,0,.5); opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s; pointer-events: none; }
  #banner.show { opacity: 1; transform: translateY(0); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div>💥 <span id="smash">0</span>　📏 <span id="dist">0</span>m</div>
</div>

<div id="banner"></div>

<div id="title" class="screen">
  <h1>猫ボール</h1>
  <p>まるくなったネコが、玄関から家の奥へどこまでもころがっていく！</p>
  <p>ボールのまま何かにぶつかったら一発アウト！<br>タップでジャンプしてネコにもどれば、花びんや段ボールなどの小物をぶっ壊せる。<br>テーブルやイス、カウンターの上は歩けるよ（据え置き家具はこわせない）。<br>部屋のさかいめは猫用扉をくぐって次の部屋へ。</p>
  <p class="keys">PC：← → / A D で左右　クリック / スペースでジャンプ<br>スマホ：左右にドラッグで移動　タップでジャンプ</p>
  <button id="startBtn">スタート</button>
</div>

<div id="over" class="screen hidden">
  <h1>ニャーン…</h1>
  <p id="result"></p>
  <p id="best"></p>
  <button id="retryBtn">もう一回</button>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
