<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猫ボール</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1410; font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,.6); pointer-events: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; color: #fff; text-align: center; background: rgba(30, 18, 10, .55); padding: max(60px, calc(env(safe-area-inset-top, 0px) + 52px)) 16px max(20px, env(safe-area-inset-bottom, 0px)); box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen > * { flex: none; }
  /* 収まるときは上下中央、はみ出すときは上から並べてスクロール */
  .screen::before, .screen::after { content: ""; flex: 1 0 0; }
  .screen h1 { font-size: clamp(44px, 12vw, 88px); margin: 0 0 8px; color: #ffcf6e; text-shadow: 0 4px 0 #b5651d, 0 8px 16px rgba(0,0,0,.5); }
  .screen p { margin: 6px 0; font-size: 18px; line-height: 1.6; }
  .screen button { margin-top: 20px; font-size: 22px; font-weight: bold; padding: 12px 40px; border: none; border-radius: 999px; background: #ff9f43; color: #fff; box-shadow: 0 5px 0 #b5651d; cursor: pointer; font-family: inherit; }
  .screen button:disabled { opacity: .6; cursor: wait; }
  .screen button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b5651d; }
  .hidden { display: none !important; }
  .keys { opacity: .85; font-size: 15px !important; }
  /* 操作説明：タッチ端末ではスマホ用だけ、それ以外ではPC用だけを出す */
  .k-touch { display: none; }
  @media (hover: none) and (pointer: coarse) { .k-pc { display: none; } .k-touch { display: inline; } }
  /* 画面の低いスマホ：文字を小さくして詰める */
  @media (max-height: 700px) {
    .screen h1 { font-size: clamp(34px, 10vw, 56px); margin-bottom: 4px; }
    .screen p { font-size: 14px; line-height: 1.5; margin: 4px 0; }
    .keys { font-size: 13px !important; }
    .screen button { margin-top: 12px; font-size: 20px; padding: 10px 34px; }
    .howto { margin-top: 10px; }
  }
  #mute { pointer-events: auto; background: rgba(0,0,0,.25); border: none; border-radius: 999px; font-size: 22px; width: 44px; height: 44px; cursor: pointer; }
  #langBtn { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: 16px; margin: 0 !important; font-size: 15px !important; padding: 6px 16px !important; background: rgba(255,255,255,.18) !important; box-shadow: none !important; border: 1px solid rgba(255,255,255,.5) !important; }
  .share { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
  .share .sh-main { margin-top: 0 !important; font-size: 17px !important; padding: 8px 26px !important; background: #3a86d4 !important; box-shadow: 0 4px 0 #22558a !important; }
  .sh-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .sh { display: inline-block; margin: 0 !important; padding: 6px 14px !important; border-radius: 999px; font-size: 14px !important; font-weight: bold; color: #fff; text-decoration: none; background: rgba(255,255,255,.16) !important; border: 1px solid rgba(255,255,255,.45) !important; box-shadow: none !important; cursor: pointer; font-family: inherit; }
  #shareX { background: #111 !important; } #shareLine { background: #06c755 !important; } #shareFb { background: #1877f2 !important; }
  .hud-btns { display: flex; gap: 8px; }
  #pauseBtn { pointer-events: auto; background: rgba(0,0,0,.25); border: none; border-radius: 999px; font-size: 20px; width: 44px; height: 44px; cursor: pointer; color: #fff; }
  .sub-btn { margin-top: 10px !important; font-size: 17px !important; padding: 8px 26px !important; background: rgba(255,255,255,.16) !important; border: 1px solid rgba(255,255,255,.5) !important; box-shadow: none !important; }
  .legal { margin-top: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 12px; opacity: .8; }
  .legal a { color: #ffe2b8; }
  .revive { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100% - 32px)); box-sizing: border-box; padding: 18px 16px; border-radius: 18px; background: rgba(20, 12, 4, .86); color: #fff; text-align: center; z-index: 5; }
  .revive p { margin: 4px 0 10px; font-size: 17px; font-weight: bold; }
  .revive button:not(.sub-btn) { font-size: 19px; font-weight: bold; padding: 12px 26px; border: none; border-radius: 999px; background: #3a86d4; color: #fff; box-shadow: 0 4px 0 #22558a; cursor: pointer; font-family: inherit; }
  .revive button:disabled { opacity: .6; }
  .howto-panel { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; background: #1b1410; }
  .howto-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top, 0px)) 12px 8px; background: #3b2a1e; }
  .howto-bar button { margin: 0 !important; font-size: 16px !important; padding: 8px 20px !important; border-radius: 999px; border: none; font-weight: bold; font-family: inherit; cursor: pointer; }
  #howtoPlay { background: #ff9f43; color: #fff; box-shadow: 0 3px 0 #b5651d; }
  #howtoClose { color: #fff; }
  .howto-panel iframe { flex: 1; border: 0; width: 100%; background: #f6efe3; }
  /* アプリでは画面の下にバナー広告が出るので、そのぶん空ける */
  body.app .screen { padding-bottom: max(70px, calc(env(safe-area-inset-bottom, 0px) + 60px)); }
  body.app .howto-panel { padding-bottom: 60px; }
  .spark { color: #ffe27a; font-weight: bold; }
  .howto { margin-top: 14px; color: #ffe2b8; font-size: 16px; text-decoration: underline; }
  #banner { position: fixed; top: 22%; left: 0; right: 0; text-align: center; color: #fff; font-size: clamp(28px, 7vw, 52px); font-weight: bold; letter-spacing: .1em; text-shadow: 0 3px 0 rgba(90,50,20,.8), 0 6px 18px rgba(0,0,0,.5); opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s; pointer-events: none; }
  #combo { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 6px 22px 10px; border-radius: 14px; background: rgba(20, 12, 4, .62); text-align: center; color: #ffe27a; font-weight: bold; font-size: clamp(22px, 5vw, 34px); white-space: nowrap; text-shadow: -2px -2px 0 #5a2a00, 2px -2px 0 #5a2a00, -2px 2px 0 #5a2a00, 2px 2px 0 #5a2a00, 0 3px 0 #5a2a00; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #combo.show { opacity: 1; }
  #comboBar { display: block; height: 6px; width: 160px; margin: 6px auto 0; border-radius: 3px; background: #ffd34d; transform-origin: left; }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; transform: translate(-50%, 0); color: #fff6c8; font-weight: bold; font-size: 22px; text-shadow: 0 2px 0 rgba(150,70,0,.9); animation: pop 0.9s ease-out forwards; }
  @keyframes pop { from { opacity: 1; transform: translate(-50%, 0) scale(1.2); } to { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
  #reach { font-size: 18px; }
  #banner.show { opacity: 1; transform: translateY(0); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="hud" class="hidden">
  <div>🚪 <span id="room">1</span>　💥 <span id="smash">0</span>　📏 <span id="dist">0</span>m</div>
  <div class="hud-btns">
    <button id="mute" aria-label="BGMのオン・オフ" data-i18n-aria="mute">🔊</button>
    <button id="pauseBtn" aria-label="ポーズ" data-i18n-aria="pause">⏸</button>
  </div>
</div>

<div id="banner"></div>
<div id="combo"><span id="comboTxt"></span><i id="comboBar"></i></div>
<div id="pops"></div>

<div id="title" class="screen">
  <button id="langBtn" type="button">English</button>
  <h1 data-i18n="title">猫ボール</h1>
  <p data-i18n="intro">ころがるネコで、家の奥までどこまで行ける？</p>
  <p class="keys" data-i18n-html="keys">PC：← → / A D で左右　クリック / スペースでジャンプ<br>スマホ：左右にドラッグで移動　タップでジャンプ</p>
  <p id="farthest" class="keys"></p>
  <button id="startBtn" disabled>じゅんび中…</button>
  <a class="howto" href="howto.html" data-i18n="howtoMore" data-i18n-href="howtoUrl">遊び方をくわしく見る</a>
  <div id="legal" class="legal">
    <span id="buildInfo"></span>
    <a href="https://techgym.jp/privacy-policy/" data-i18n="privacy" data-i18n-href="privacyUrl" target="_blank" rel="noopener">プライバシーポリシー</a>
    <a id="adPrivacy" href="#" data-i18n="adSettings" hidden>広告の設定</a>
  </div>
</div>

<div id="over" class="screen hidden">
  <h1 data-i18n="overTitle">ニャーン…</h1>
  <p id="result"></p>
  <p id="reach"></p>
  <p id="best"></p>
  <button id="retryBtn" data-i18n="retry">もう一回</button>
  <button id="toTitleBtn" type="button" class="sub-btn" data-i18n="toTitle">タイトルへ</button>
  <div id="share" class="share">
    <button id="shareNative" type="button" class="sh-main" data-i18n="shareBtn">結果をシェア</button>
    <div class="sh-row">
      <a id="shareX" class="sh" target="_blank" rel="noopener">X</a>
      <a id="shareLine" class="sh" target="_blank" rel="noopener">LINE</a>
      <a id="shareFb" class="sh" target="_blank" rel="noopener">Facebook</a>
      <button id="shareCopy" type="button" class="sh" data-i18n="copyLink">リンクをコピー</button>
    </div>
  </div>
  <a class="howto" href="howto.html" data-i18n="howto" data-i18n-href="howtoUrl">遊び方</a>
</div>

<!-- ポーズ画面 -->
<div id="pause" class="screen hidden">
  <h1 data-i18n="pauseTitle">ポーズ</h1>
  <button id="resumeBtn" type="button" data-i18n="resume">つづける</button>
  <button id="pauseTitleBtn" type="button" class="sub-btn" data-i18n="toTitle">タイトルへ</button>
</div>

<!-- リワード広告：ぶつかったあと、広告を見てその場から続ける（アプリのみ） -->
<div id="revive" class="revive hidden">
  <p id="reviveMsg" data-i18n="reviveMsg">広告を見て、ここから続ける？</p>
  <button id="reviveWatch" type="button"></button>
  <p id="reviveNote" class="keys"></p>
  <button id="reviveSkip" type="button" class="sub-btn"></button>
</div>

<!-- あそびかた（ページを読み直さずに重ねて表示する） -->
<div id="howtoPanel" class="howto-panel hidden">
  <div class="howto-bar">
    <button id="howtoClose" type="button" class="sub-btn" data-i18n="back">もどる</button>
    <button id="howtoPlay" type="button" data-i18n="play">プレイ</button>
  </div>
  <iframe id="howtoFrame" title="遊び方"></iframe>
</div>

<script src="js/build-info.js"></script>
<script src="js/ads-config.js"></script>
<script src="js/ads.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
